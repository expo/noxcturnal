name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify
      - run: pnpm benchmark
      - run: pnpm rust:format
      - run: pnpm rust:lint
      - run: pnpm pack --pack-destination "$(mktemp -d)"
      - run: git diff --check

  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            package: darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            package: darwin-x64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            package: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            package: linux-arm64-gnu
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            package: linux-x64-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            package: linux-arm64-musl
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            package: win32-x64-msvc
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            package: win32-arm64-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec napi build --platform --release --target ${{ matrix.target }}
      - name: Stage platform binary
        shell: bash
        run: cp noxcturnal.*.node npm/${{ matrix.package }}/
      - uses: actions/upload-artifact@v4
        with:
          name: noxcturnal-${{ matrix.package }}
          path: npm/${{ matrix.package }}/*.node
          if-no-files-found: error

  # Correctness of the Flow path, separate from whether it builds everywhere.
  # One runner is enough: the erasure rules are platform-independent.
  flow-verify:
    name: Flow erasure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: pnpm install --frozen-lockfile
      - run: pnpm hermes:fetch
      - run: pnpm hermes:check
      - run: pnpm codegen:estree:check
      - run: cargo test -p hermes-parser-sys -p hermes-flow --features hermes-flow/parser
      - run: cargo clippy -p hermes-parser-sys -p hermes-flow --all-targets --features hermes-flow/parser -- -D warnings
      # The equivalence harness replaces the byte-identical corpus gate, which
      # stops applying to Flow files once erasure preserves their formatting. It
      # needs real Flow to run against, and React Native is the corpus that
      # decides which Flow syntax the ecosystem writes, so it is fetched rather
      # than vendored.
      - name: Fetch a Flow corpus
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cd "$RUNNER_TEMP/corpus"
          npm pack react-native --silent
          tar -xzf react-native-*.tgz
      - run: pnpm exec napi build --platform --release --features flow_parser
      - run: pnpm build:js
      # Divergences always fail. The coverage floor sits well under the measured
      # figure so that ordinary drift shows up as a number rather than as a
      # broken build, and only a collapse stops the line.
      - run: node scripts/flow-equivalence.mjs --corpus "$RUNNER_TEMP/corpus/package" --min-coverage 90

  # The gate for native Flow erasure. `flow_parser` builds Hermes' parser
  # through its own CMake, so it has to hold on every target the package
  # releases for — including the two musl targets and the Windows cross-build —
  # before any of the erasure work above it is worth having. Kept separate from
  # `native` so a failure here never blocks the artifacts that ship today.
  flow-parser:
    name: Flow parser ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # CMake ships on every runner image; Ninja does not, and the build script
      # falls back to the platform default generator when it is missing.
      - name: Install Ninja
        shell: bash
        run: |
          if command -v ninja >/dev/null; then exit 0; fi
          case "${{ runner.os }}" in
            Linux) sudo apt-get update && sudo apt-get install -y ninja-build ;;
            macOS) brew install ninja ;;
            Windows) choco install ninja --no-progress -y ;;
          esac
      # musl has no C++ toolchain on the stock image. `--cross-compile` routes
      # non-Windows targets through cargo-zigbuild, which brings its own libc++.
      - name: Install Zig
        if: endsWith(matrix.target, '-musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm hermes:fetch
      - name: Build with flow_parser
        shell: bash
        run: |
          cross=''
          case "${{ matrix.target }}" in *-musl) cross='--cross-compile' ;; esac
          pnpm exec napi build --platform --release \
            --target ${{ matrix.target }} --features flow_parser $cross
      - name: Report artifact size
        shell: bash
        run: ls -l noxcturnal.*.node
