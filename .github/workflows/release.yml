name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: Check release state
    runs-on: ubuntu-24.04
    outputs:
      has_changesets: ${{ steps.changesets.outputs.has_changesets }}
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.version.outputs.changed || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for pending changesets
        id: changesets
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo 'has_changesets=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changesets=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether the package version is new
        if: steps.changesets.outputs.has_changesets != 'true'
        id: version
        run: node scripts/check-release-version.mjs

  native:
    name: Build ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.has_changesets != 'true' && needs.check.outputs.version_changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            build_args: --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build_args: -x
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            build_args: -x
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Zig for musl
        if: contains(matrix.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build native binding
        shell: bash
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} ${{ matrix.build_args }}
      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.target }}
          path: noxcturnal.*.node
          if-no-files-found: error

  release:
    name: Version or publish
    needs:
      - check
      - native
    if: always() && needs.check.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.check.outputs.has_changesets == 'true' || needs.check.outputs.version_changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: npm install --global npm@11.6
      - uses: actions/download-artifact@v4
        if: needs.check.outputs.version_changed == 'true'
        with:
          pattern: binding-*
          path: artifacts
          merge-multiple: true
      - name: Stage native packages
        if: needs.check.outputs.version_changed == 'true'
        run: node scripts/stage-native-artifacts.mjs
      - name: Create release PR or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
