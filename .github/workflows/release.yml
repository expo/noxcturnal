name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      smoke_matrix: ${{ steps.plan.outputs.smokeMatrix }}
      musl_smoke_matrix: ${{ steps.plan.outputs.muslSmokeMatrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}
      - name: Require the release commit to remain at main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - id: plan
        env:
          NOXCTURNAL_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: nix develop .#release --command node scripts/release.mjs plan

  version:
    name: Create release pull request
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - name: Require release checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - run: nix develop .#release --command pnpm install --offline --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: nix develop .#release --command node scripts/release.mjs version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOXCTURNAL_RELEASE_SHA: ${{ needs.plan.outputs.sha }}

  build:
    name: Build native artifacts
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    strategy:
      fail-fast: false
      matrix:
        architecture: [aarch64, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Require release checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - run: |
          test "$(uname -m)" = x86_64
          nix build ".#native-artifacts-${{ matrix.architecture }}" \
            --out-link target/native-artifacts \
            --log-lines 100 \
            --max-jobs 1
          cp -R -L target/native-artifacts target/native-artifacts-upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-artifacts-${{ matrix.architecture }}
          path: target/native-artifacts-upload/*
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Require release checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-artifacts-*
          merge-multiple: true
          path: artifacts
      - name: Load ${{ matrix.target }}
        run: node scripts/native.mjs smoke artifacts/${{ matrix.target }} ${{ matrix.target }}

  smoke-musl:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.musl_smoke_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Require release checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-artifacts-*
          merge-multiple: true
          path: artifacts
      - name: Load ${{ matrix.target }} in pinned Alpine/Node image
        run: >-
          docker run --rm --volume "$PWD:/work" --workdir /work
          node@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
          node scripts/native.mjs smoke
          artifacts/${{ matrix.target }} ${{ matrix.target }}

  validate:
    name: Validate packages
    needs: [plan, build, smoke, smoke-musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Require release checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-artifacts-*
          merge-multiple: true
          path: artifacts
      - run: node scripts/native.mjs materialize --artifact-root artifacts
      - run: nix develop .#release --command pnpm install --offline --frozen-lockfile --ignore-scripts
      - run: nix develop .#release --command pnpm package:check --release
      - run: >-
          nix develop .#release --command pnpm --recursive --include-workspace-root pack
          --pack-destination target/npm-tarballs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-packages
          path: |
            npm/*/*.node
            target/native-staging-manifest.json
          if-no-files-found: error

  publish:
    name: Publish packages
    needs: [plan, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/noxcturnal
    permissions:
      contents: write
      id-token: write
    env:
      # npm provenance cannot reference a private source repository. Trusted
      # publishing still authenticates this job with short-lived OIDC credentials.
      NPM_CONFIG_PROVENANCE: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - name: Require release checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-packages
      - run: nix develop .#release --command pnpm install --offline --frozen-lockfile --ignore-scripts
      - run: nix develop .#release --command pnpm package:check --release
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: nix develop .#release --command node scripts/release.mjs publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOXCTURNAL_RELEASE: '1'
          NOXCTURNAL_RELEASE_ENVIRONMENT: npm
          NOXCTURNAL_RELEASE_SHA: ${{ needs.plan.outputs.sha }}
