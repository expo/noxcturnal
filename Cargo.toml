[workspace]
members = ["crates/*"]

# Shared by every crate in the workspace through `[lints] workspace = true`, so
# the sub-crates are held to the same baseline as the napi boundary.
[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
format_push_string = "warn"
redundant_clone = "warn"

[package]
name = "noxcturnal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native-backed JavaScript transform runtime with visitor ergonomics"

[lib]
crate-type = ["cdylib"]

[features]
default = ["react_compiler", "flow_parser"]
react_compiler = ["oxc_transformer/react_compiler", "dep:oxc_react_compiler"]
# Native Flow erasure. This default capability builds Hermes, requiring CMake,
# Python, and a C++ toolchain in every supported build environment.
flow_parser = ["dep:hermes-flow", "hermes-flow/parser"]

[dependencies]
hermes-flow = { path = "crates/hermes-flow", optional = true }
napi = { version = "3.4.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.3.0"
oxc_allocator = "=0.141.0"
oxc_ast = "=0.141.0"
oxc_ast_visit = "=0.141.0"
oxc_codegen = "=0.141.0"
oxc_diagnostics = "=0.141.0"
oxc_ecmascript = "=0.141.0"
oxc_parser = "=0.141.0"
oxc_react_compiler = { version = "=0.141.0", optional = true }
oxc_regular_expression = "=0.141.0"
oxc_semantic = "=0.141.0"
# `oxc_sourcemap` has an independent release train; this is the version declared
# by `oxc_codegen` 0.141.0.
oxc_sourcemap = "=8.0.2"
oxc_span = "=0.141.0"
oxc_syntax = "=0.141.0"
oxc_transformer = "=0.141.0"
regex-syntax = "0.8.8"
rustc-hash = "2.1.3"
self_cell = "1.3.0"
semver = "1.0.27"
serde_json = "1.0.145"

[build-dependencies]
napi-build = "2.2.3"

# Keep the native boundary held to the same baseline quality checks as Oxc.
[lints]
workspace = true

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
